version: 2
updates:
  # Экосистема uv покрывает и pyproject.toml, и uv.lock. Отдельный блок pip на
  # том же каталоге давал бы вторую пачку PR на те же зависимости.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels: ["dependencies", "automated"]
    commit-message:
      prefix: "chore"
    groups:
      uv-all:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels: ["dependencies", "automated"]
    commit-message:
      prefix: "chore"
    groups:
      github-actions-all:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels: ["dependencies", "automated"]
    commit-message:
      prefix: "chore"
    # Теги питона включают релиз-кандидаты и альфы, и Dependabot предлагал
    # поднять базовый образ до 3.15.0rc1.
    ignore:
      - dependency-name: "python"
        versions: ["*rc*", "*a[0-9]*", "*b[0-9]*"]
    groups:
      docker-all:
        patterns: ["*"]
