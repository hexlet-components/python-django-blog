[project]
name = "python-django-blog"
version = "0.1.0"
description = "A simple Django project that implements a simple blog"
authors = [{name="Hexlet Team <info@hexlet.io>"}]
license = "ISC"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1",
    "django-bootstrap4>=26.1",
    "gunicorn>=26.0.0",
    "python-dotenv>=1.2.2",
    "whitenoise>=6.12.0",
]

[project.scripts]
django-admin = "python_django_blog.admin:main"

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["python_django_blog", "articles"]
module-root = ""
